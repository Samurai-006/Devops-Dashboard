apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: devops-dashboard
type: Opaque
stringData:
  POSTGRES_USER: devops
  POSTGRES_PASSWORD: devops
  POSTGRES_DB: dashboard_prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-dashboard
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
