services:
  backend:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on:
      - db

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    environment:
      FRONTEND_API_BASE_URL: ${FRONTEND_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
